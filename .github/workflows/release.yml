name: Release

# Déclenché par un tag de version : git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # créer la release GitHub
  packages: write   # publier l'image sur GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cap_test
      ADMIN_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Le tag doit correspondre à la version du package.json
        run: node scripts/check-version.js "${GITHUB_REF_NAME}"

      - run: npm ci
      - run: npm -w apps/api run typecheck
      - run: npm -w apps/api test
      - run: npm -w apps/api run build

      - name: Extraire les notes de version du CHANGELOG
        run: node scripts/release-notes.js "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Déploiement : volontairement NON implémenté. Aucun serveur cible n'est défini à ce stade.
  # Une fois l'hébergement choisi (VPS, Render, etc.), ajouter ici un job `deploy` protégé par
  # un environnement GitHub "production" avec approbation manuelle et des secrets d'environnement.
