# Développement local uniquement. Ne pas exposer tel quel en production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: codeacademy
    ports: ["127.0.0.1:5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cap -d codeacademy"]
      interval: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cap:${POSTGRES_PASSWORD}@db:5432/codeacademy
      JWT_SECRET: ${JWT_SECRET:?définissez JWT_SECRET dans .env (openssl rand -base64 48)}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
    ports: ["127.0.0.1:4000:4000"]
volumes:
  dbdata:
